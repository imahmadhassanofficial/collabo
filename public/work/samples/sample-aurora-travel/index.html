<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora Travel – sample ad</title><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Poppins,system-ui,-apple-system,Segoe UI,Arial,sans-serif;-webkit-user-select:none;user-select:none}
.tag{position:absolute;top:8px;right:8px;font-size:9px;letter-spacing:.08em;border:1px solid currentColor;border-radius:99px;padding:2px 7px;opacity:.85;z-index:9}
.brand{font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cta{display:inline-block;border:0;border-radius:99px;font-weight:600;cursor:pointer;font-family:inherit}

body{background:linear-gradient(135deg,#130b3a,#6a3ee8);color:#fff}
.wrap{position:relative;width:100%;height:100%;padding:6vh 6vw;display:flex;flex-direction:column}
.brand{font-size:max(12px,2.2vh)}.h{font:600 max(22px,7vh)/1.05 Georgia,serif;margin-top:3vh;max-width:70%}
.opts{display:flex;gap:2vw;margin-top:auto}
.o{flex:1;border-radius:2vh;padding:2.5vh 2vw;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);cursor:pointer;transition:.3s;font-family:inherit;color:#fff;text-align:left}
.o:hover,.o.on{background:#7cf7d4;color:#130b3a;transform:translateY(-6px)}.o b{display:block;font-size:max(14px,3.4vh)}.o span{font-size:max(11px,2vh);opacity:.85}
.msg{margin-top:2.5vh;font-size:max(12px,2.4vh);min-height:3vh}.tag{font-size:max(9px,1.6vh);top:3vh;right:3vw}
.aur{position:absolute;inset:0;background:radial-gradient(40% 30% at 70% 20%,rgba(124,247,212,.35),transparent),radial-gradient(30% 25% at 30% 10%,rgba(255,255,255,.15),transparent);animation:a 6s ease-in-out infinite alternate;pointer-events:none}
@keyframes a{to{transform:translateX(-4%) skewX(-6deg)}}</style></head><body><div class="aur"></div><div class="wrap"><span class="tag">SAMPLE</span><div class="brand">Aurora Travel</div><div class="h">Where will you wake up next?</div>
<div class="opts"><button class="o"><b>Reykjavík</b><span>Northern lights · 5 nights</span></button><button class="o"><b>Kyoto</b><span>Temples &amp; tea · 7 nights</span></button><button class="o"><b>Lisbon</b><span>Sun &amp; tiles · 4 nights</span></button></div>
<div class="msg" id="m">Pick a destination with your remote or click.</div></div><script>document.querySelectorAll('.o').forEach(b=>b.onclick=()=>{document.querySelectorAll('.o').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('m').textContent='Great choice — '+b.querySelector('b').textContent+' trips from $899. Scan the QR on screen to book.'});</script></body></html>
