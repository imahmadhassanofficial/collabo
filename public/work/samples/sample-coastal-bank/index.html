<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coastal Bank – sample ad</title><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Poppins,system-ui,-apple-system,Segoe UI,Arial,sans-serif;-webkit-user-select:none;user-select:none}
.tag{position:absolute;top:8px;right:8px;font-size:9px;letter-spacing:.08em;border:1px solid currentColor;border-radius:99px;padding:2px 7px;opacity:.85;z-index:9}
.brand{font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cta{display:inline-block;border:0;border-radius:99px;font-weight:600;cursor:pointer;font-family:inherit}
body{width:728px;height:90px}
body{background:linear-gradient(90deg,#00303f,#00a6a6);color:#fff}
.wrap{position:relative;width:728px;height:90px;display:flex;align-items:center;gap:16px;padding:0 16px 0 52px;overflow:hidden}
.brand{font-size:11px;white-space:nowrap}.h{font:600 19px/1.1 Georgia,serif;white-space:nowrap}
.rate{display:flex;align-items:baseline;gap:4px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:10px}
.rate b{font-size:22px;color:#f6d365}.rate small{font-size:11px;opacity:.85}
.wave{position:absolute;left:0;bottom:-6px;width:200%;height:24px;background:radial-gradient(circle at 20px -8px,transparent 18px,rgba(255,255,255,.12) 19px) 0 0/40px 24px repeat-x;animation:wv 4s linear infinite}
@keyframes wv{to{transform:translateX(-40px)}}
.cta{margin-left:auto;background:#f6d365;color:#00303f;padding:10px 18px;font-size:13px;white-space:nowrap}.tag{top:6px;right:auto;left:8px;font-size:8px}</style></head><body><div class="wrap"><span class="tag">SAMPLE</span><div class="brand">Coastal Bank</div><div class="h">Savings that move with the tide</div>
<div class="rate"><b id="n">0.00</b><b>%</b><small>APY*</small></div><button class="cta">Open account</button><div class="wave"></div></div><script>let v=0;const n=document.getElementById('n');const t=setInterval(()=>{v+=.09;if(v>=4.5){v=4.5;clearInterval(t)}n.textContent=v.toFixed(2)},30);</script></body></html>
