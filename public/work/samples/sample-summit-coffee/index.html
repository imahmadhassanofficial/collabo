<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Summit Coffee – sample ad</title><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Poppins,system-ui,-apple-system,Segoe UI,Arial,sans-serif;-webkit-user-select:none;user-select:none}
.tag{position:absolute;top:8px;right:8px;font-size:9px;letter-spacing:.08em;border:1px solid currentColor;border-radius:99px;padding:2px 7px;opacity:.85;z-index:9}
.brand{font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cta{display:inline-block;border:0;border-radius:99px;font-weight:600;cursor:pointer;font-family:inherit}
body{width:320px;height:480px}
body{background:linear-gradient(160deg,#3b1f12,#c7793a);color:#fff}
.wrap{position:relative;width:320px;height:480px;padding:22px;display:flex;flex-direction:column}
.brand{font-size:13px}.h{font:600 30px/1.1 Georgia,serif;margin-top:22px}
.cup{position:relative;width:130px;height:150px;margin:28px auto 0;border:6px solid #fff;border-top:0;border-radius:0 0 40px 40px;overflow:hidden;cursor:pointer}
.cup:after{content:'';position:absolute;right:-34px;top:20px;width:30px;height:50px;border:6px solid #fff;border-left:0;border-radius:0 24px 24px 0}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#a0522d,#5b2c14);transition:height 1.6s cubic-bezier(.2,.8,.2,1)}
.steam{position:absolute;left:50%;top:-40px;width:8px;height:30px;border-radius:8px;background:rgba(255,255,255,.6);opacity:0;transform:translateX(-50%)}
.on .steam{animation:st 1.6s 1.2s infinite}@keyframes st{0%{opacity:0;transform:translate(-50%,10px)}50%{opacity:.8}100%{opacity:0;transform:translate(-50%,-20px)}}
.on .fill{height:85%}
.hint{text-align:center;margin-top:16px;font-size:13px;opacity:.85;animation:b 1.2s infinite alternate}.on .hint{display:none}@keyframes b{to{opacity:.4}}
.end{margin-top:auto;opacity:0;transform:translateY(16px);transition:.6s 1.6s}.on .end{opacity:1;transform:none}
.end p{font-size:14px;margin-bottom:12px}.cta{background:#ffd27a;color:#3b1f12;padding:12px 22px;font-size:14px}</style></head><body><div class="wrap" id="w"><span class="tag">SAMPLE</span><div class="brand">Summit Coffee</div><div class="h">Wake up to the summit blend</div>
<div style="position:relative"><div class="cup" id="cup"><div class="fill"></div></div><div class="steam"></div></div><div class="hint">Tap the cup to pour ☕</div>
<div class="end"><p>Small-batch roast · 20% off your first bag</p><button class="cta">Order now</button></div></div><script>document.getElementById('cup').onclick=()=>document.getElementById('w').classList.add('on');</script></body></html>
